name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Setup Python development environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          uv sync --group all --python "3.13"
      - uses: actions/cache@v6
        id: cache-docs
        with:
          path: docs/_examples_database/
          # See https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          key: docs_database_and_stim_results_cache-${{ github.run_id }}
          enableCrossOsArchive: true
          restore-keys: |
            docs_database_and_stim_results_cache
      - name: Generate the documentation
        run: |
          uv run --group all make html
        working-directory: docs/
      - name: Check for broken links
        run: |
          uv run --group all make linkcheck
        working-directory: docs/
        # working-directory ensures the build relies on cached statistics and database in docs/_examples_database/
        # this is used to reduce the docs build time in the CI.
      - name: Deploy if 'main' branch
        uses: peaceiris/actions-gh-pages@v4
        # Only publish if we are on main!
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html/
          # Preserve pull request previews when refreshing the main documentation.
          keep_files: true
      - name: Deploy if PR
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref != 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html/
          destination_dir: ./pull/${{github.event.number}}/
        continue-on-error: true
      - name: Add comment if PR
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          header: documentation-preview
          recreate: true
          message: |
            Commit [`${{ github.event.pull_request.head.sha }}`](${{ github.event.pull_request.head.repo.html_url }}/commit/${{ github.event.pull_request.head.sha }}) has been uploaded and can be previewed here:

            ✨ https://tqec.github.io/tqec/pull/${{github.event.number}}/ ✨

            Changes may take a few minutes to propagate.
        continue-on-error: true
