name: PR Quality

permissions:
  contents: read
  issues: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    steps:
      # Overrides a closure by anti-slop or by the private-profile step that was a mistake. When a user listed here
      # reopens a PR that one of them closed, this step adds the exempt label (`exempt-label` below), so both skip this
      # run and every later run on the PR, such as an edit. Any other reopen is checked again.
      - name: Exempt a PR reopened by an override user
        id: override
        if: github.event.action == 'reopened'
        uses: actions/github-script@v9
        env:
          EXEMPT_LABEL: exempt
          # stale.yml also closes PRs as github-actions[bot]; actions/stale labels a PR with this before closing it.
          STALE_LABEL: Stale
          OVERRIDE_USERS: >-
            afowler, angelaelisa, BSchelpe, HaoTy, inmzhang, jbolns, KabirDubey, nelimee, purva-thakre, smburdick,
            Zhaoyilunnn
        with:
          # Retries GitHub API calls that fail with a server error (5xx).
          retries: 3
          script: |
            const users = process.env.OVERRIDE_USERS.split(",").map((u) => u.trim().toLowerCase());
            const sender = context.payload.sender.login;
            if (!users.includes(sender.toLowerCase())) {
              core.info(`${sender} is not an override user; running the checks.`);
              return;
            }
            // anti-slop, the private-profile step and stale.yml all close as github-actions[bot]; a stale closure
            // leaves the stale label.
            const events = await github.paginate(github.rest.issues.listEvents, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const closer = events.filter((e) => e.event === "closed").at(-1)?.actor?.login;
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            if (closer !== "github-actions[bot]" || labels.includes(process.env.STALE_LABEL)) {
              core.info(`The PR was not closed by these checks (closed by ${closer}); running the checks.`);
              return;
            }
            core.setOutput("exempt", "true");
            core.info(`${sender} reopened a PR that these checks closed; skipping the checks.`);
            try {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [process.env.EXEMPT_LABEL],
              });
            } catch (error) {
              const label = process.env.EXEMPT_LABEL;
              core.warning(`Could not add the ${label} label, so a later run may close the PR: ${error.message}`);
            }

      # anti-slop cannot make one check close a PR by itself, so this step closes a PR whose author has a private
      # profile. The first-comment notice tells commenters so; .github/scripts/pr-quality.test.js runs this script.
      - name: Close a PR from a private profile
        id: private-profile
        if: steps.override.outputs.exempt != 'true'
        uses: actions/github-script@v9
        env:
          # The exemptions of anti-slop below (exempt-bots and exempt-users, exempt-author-association, exempt-label).
          # .github/scripts/pr-quality.test.js fails when they differ.
          EXEMPT_USERS: actions-user, autofix-ci[bot], dependabot[bot], renovate[bot], github-actions[bot]
          EXEMPT_ASSOCIATIONS: OWNER, MEMBER, COLLABORATOR
          EXEMPT_LABEL: exempt
          MESSAGE: >-
            Thank you for the PR! It was closed automatically because your GitHub profile is private, and we accept
            pull requests only from public profiles. To make your profile public, clear "Make profile private and hide
            activity" in your profile settings (https://github.com/settings/profile). Then comment here and a
            maintainer will take a look.
        with:
          # Retries GitHub API calls that fail with a server error (5xx).
          retries: 3
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const list = (name) => process.env[name].split(",").map((v) => v.trim().toLowerCase()).filter(Boolean);
            if (pr.state !== "open") return core.info("The PR is closed; skipping.");
            if (list("EXEMPT_USERS").includes(author.toLowerCase())) {
              return core.info(`${author} is exempt; skipping.`);
            }
            if (list("EXEMPT_ASSOCIATIONS").includes(pr.author_association.toLowerCase())) {
              return core.info(`Author association ${pr.author_association} is exempt; skipping.`);
            }
            if (pr.labels.some((l) => l.name === process.env.EXEMPT_LABEL)) {
              return core.info(`The PR has the ${process.env.EXEMPT_LABEL} label; skipping.`);
            }
            let profile;
            try {
              ({ data: profile } = await github.rest.users.getByUsername({ username: author }));
            } catch (error) {
              const reason = error.message;
              return core.warning(`Could not read the profile of ${author}, so only anti-slop checks it: ${reason}`);
            }
            // anti-slop counts a missing user_view_type as private. Closing on this check alone needs "private".
            if (profile.user_view_type !== "private") return core.info(`${author} has a public profile.`);
            // A failure here must not fail the step, or anti-slop would not run. Close first, so the comment never
            // says that an open PR was closed.
            try {
              await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: "closed" });
            } catch (error) {
              return core.warning(`Could not close the PR, so only anti-slop checks it: ${error.message}`);
            }
            core.setOutput("closed", "true");
            core.info(`${author} has a private profile; closed the PR.`);
            try {
              const body = process.env.MESSAGE;
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            } catch (error) {
              core.warning(`Could not comment on the closed PR: ${error.message}`);
            }

      # .github/scripts/first-comment-notice.js mirrors the account checks of this version and reads the settings
      # below. When you change the version, update that script too; its test fails until you do.
      - uses: peakoss/anti-slop@v0.3.0
        if: steps.override.outputs.exempt != 'true' && steps.private-profile.outputs.closed != 'true'
        with:
          # General Settings
          max-failures: 4

          # PR Branch Checks
          allowed-target-branches: ""
          blocked-target-branches: ""
          allowed-source-branches: ""
          blocked-source-branches: |
            main
            master

          # PR Size Checks
          max-changed-files: 50
          max-changed-lines: 1000

          # PR Quality Checks
          max-negative-reactions: 0
          require-maintainer-can-modify: true

          # PR Title Checks
          require-conventional-title: false

          # PR Description Checks
          require-description: true
          max-description-length: 4000
          max-emoji-count: 2
          max-code-references: 5
          require-linked-issue: false
          blocked-terms: ""
          blocked-issue-numbers: ""

          # PR Template Checks
          require-pr-template: true
          strict-pr-template-sections: ""
          optional-pr-template-sections: ""
          max-additional-pr-template-sections: 2

          # Commit Message Checks
          max-commit-message-length: 500
          require-conventional-commits: false
          # Off: a maintainer's "Update branch" merge commit counts as another author (tqec#1094).
          require-commit-author-match: false
          blocked-commit-authors: ""

          # File Checks
          allowed-file-extensions: ""
          allowed-paths: ""
          blocked-paths: |
            SECURITY.md
            LICENSE
            CODE_OF_CONDUCT.md
            AGENTS.md
          require-final-newline: true
          max-added-comments: 150

          # User Checks
          detect-spam-usernames: false
          min-account-age: 30
          max-daily-forks: 10
          # The private-profile step above closes a PR from a private profile first. This check still counts a
          # profile that the step could not read.
          require-public-profile: true
          min-profile-completeness: 2

          # Merge Checks
          min-repo-merged-prs: 0
          min-repo-merge-ratio: 0
          min-global-merge-ratio: 30
          global-merge-ratio-exclude-own: false

          # Exemptions
          exempt-draft-prs: false
          exempt-bots: |
            actions-user
            autofix-ci[bot]
            dependabot[bot]
            renovate[bot]
            github-actions[bot]
          exempt-users: ""
          exempt-author-association: "OWNER,MEMBER,COLLABORATOR"
          # Keep in sync with EXEMPT_LABEL in the steps above.
          exempt-label: "exempt"
          exempt-pr-label: ""
          exempt-all-milestones: false
          exempt-all-pr-milestones: false
          exempt-milestones: ""
          exempt-pr-milestones: ""

          # PR Success Actions
          success-add-pr-labels: ""

          # PR Failure Actions
          failure-remove-pr-labels: ""
          failure-remove-all-pr-labels: false
          failure-add-pr-labels: ""
          failure-pr-message: "Thank you for the PR! It was closed automatically because it failed several of our automated quality checks. This run lists which ones: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (each check is described in https://github.com/peakoss/anti-slop#all-options). If you think this is a mistake, comment here and a maintainer will take a look."
          close-pr: true
          lock-pr: false
